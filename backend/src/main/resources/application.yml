# =====================================================================
# application.yml — DatLichKhamBenh Backend
# Clone về → Run ngay: DB tự tạo, bảng tự sinh, seed data tự load.
# =====================================================================

spring:
  application:
    name: datlichkhambenh-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    deserialization:
      accept-empty-string-as-null-object: true

  # ─── MySQL ───────────────────────────────────────────────────────
  datasource:
    # createDatabaseIfNotExist=true → tự tạo DB nếu chưa có
    url: ${DB_URL:jdbc:mysql://localhost:3307/datlichkhambenh?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

  # ─── JPA / Hibernate ─────────────────────────────────────────────
  jpa:
    hibernate:
      # update → Hibernate tự tạo/cập nhật bảng theo Entity Java
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Flyway chỉ bật ở profile prod (xem application-prod.yml); dev dùng ddl-auto, test dùng H2.
  flyway:
    enabled: false

  # ─── Khởi tạo dữ liệu ─────────────────────────────────────────────
  # Không chạy file SQL nào lúc khởi động: Hibernate (ddl-auto) tạo bảng,
  # DataInitializer (ApplicationRunner, profile dev) nạp dữ liệu mẫu với mật khẩu BCrypt.
  sql:
    init:
      mode: never

  # ─── Redis ───────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # ─── Mail (Async Email Notification) ─────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

  # ─── Async Task Executor ──────────────────────────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: async-email-

# ─── Server ──────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:18081}
  servlet:
    context-path: /

# ─── JWT ─────────────────────────────────────────────────────────────
app:
  pricing:
    vip-discount-rate: ${VIP_DISCOUNT_RATE:0.1}
    insurance-discount-rate: ${INSURANCE_DISCOUNT_RATE:0.8}
    # Tỷ lệ giảm trong [0, 1]; Tiêu chuẩn mặc định trả 100%.
    standard-discount-rate: ${STANDARD_DISCOUNT_RATE:0}
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d7e1b3a5f6c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}         # 24 giờ
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 ngày

  # ─── Redis Cache TTL (giây) ──────────────────────────────────────
  cache:
    doctor-list-ttl: ${CACHE_DOCTOR_LIST_TTL:300}          # 5 phút
    available-slots-ttl: ${CACHE_AVAILABLE_SLOTS_TTL:60}   # 1 phút

  # ─── SMS (Adapter → eSMS). Mặc định TẮT: SMS thật tốn phí theo tin. ──────────
  sms:
    enabled: ${SMS_ENABLED:false}
    esms:
      endpoint: ${ESMS_ENDPOINT:https://rest.esms.vn/MainService.svc/json/SendMultipleMessage_V4_post_json/}
      api-key: ${ESMS_API_KEY:}
      secret-key: ${ESMS_SECRET_KEY:}
      sms-type: ${ESMS_SMS_TYPE:8}
      sandbox: ${ESMS_SANDBOX:false}   # true: eSMS nhận nhưng không gửi và không trừ tiền

  messaging:
    email-exchange: clinic.email.exchange
    email-queue: clinic.email.queue
    email-routing-key: clinic.email.send

# ─── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ─────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.datlichkhambenh: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${LOG_SQL_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
