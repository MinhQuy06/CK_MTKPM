# =====================================================================
# application-prod.yml — chạy "production" (local, Docker Compose)
# Mọi bí mật lấy từ biến môi trường, KHÔNG có giá trị mặc định:
# thiếu biến nào thì app không khởi động.
# =====================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # schema do Flyway quản lý
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  bootstrap:
    # Admin đầu tiên, chỉ tạo khi chưa có Admin nào đang hoạt động (xem AdminBootstrap).
    admin-email: ${ADMIN_EMAIL}
    admin-password: ${ADMIN_PASSWORD}

logging:
  level:
    root: INFO
    com.datlichkhambenh: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health          # không lộ metrics/info ra ngoài
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false             # SMTP chập chờn không được làm app "DOWN"
